<!doctype html>
<html>
<head><meta charset="utf-8"><title>lottie.js browser Worker spike</title></head>
<body>
<pre id="out">running...</pre>
<script>
  const out = document.getElementById("out");
  const worker = new Worker("./browser-worker.mjs", { type: "module" });
  worker.onmessage = (e) => {
    out.textContent = (e.data.ok ? "PASS: " : "FAIL: ") + e.data.message;
  };
  worker.onerror = (e) => {
    out.textContent = "FAIL: worker error: " + e.message;
  };
</script>
</body>
</html>
